<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محمود & رويدا</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --gold: #C9A84C; --gold-light: #E8C97A; --gold-dim: #8B6914;
  --cream: #FDF6E3; --brown: #1A0E08; --brown-mid: #3D2010;
}
html, body { width: 100%; height: 100%; background: #0a0502; font-family: "Tajawal", sans-serif; overflow-x: hidden; }

#intro {
  position: fixed; inset: 0; z-index: 100;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: #0a0502; cursor: pointer;
}
.intro-particles { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.particle {
  position: absolute; width: 2px; height: 2px;
  background: var(--gold-light); border-radius: 50%;
  animation: rise var(--d) ease-in infinite; opacity: 0;
}
@keyframes rise {
  0% { transform: translateY(100vh) scale(0); opacity: 0; }
  10% { opacity: 0.8; } 90% { opacity: 0.4; }
  100% { transform: translateY(-20vh) scale(1.5); opacity: 0; }
}
.intro-ring-wrap {
  position: relative; width: 120px; height: 120px; margin-bottom: 40px;
  animation: spinIn 1.2s cubic-bezier(0.16,1,0.3,1) both;
}
@keyframes spinIn {
  from { transform: scale(0) rotate(-180deg); opacity: 0; }
  to   { transform: scale(1) rotate(0deg); opacity: 1; }
}
.intro-ring {
  position: absolute; border-radius: 50%; border: 2px solid var(--gold);
  top: 50%; left: 50%;
}
.intro-ring:nth-child(1) { width: 80px; height: 80px; transform: translate(-70%, -50%); animation: pulse-ring 2s ease-in-out infinite; }
.intro-ring:nth-child(2) { width: 80px; height: 80px; transform: translate(-30%, -50%); animation: pulse-ring 2s ease-in-out infinite 0.3s; }
.intro-ring:nth-child(3) { width: 110px; height: 110px; transform: translate(-50%, -50%); border-color: rgba(201,168,76,0.2); animation: pulse-ring 3s ease-in-out infinite; }
@keyframes pulse-ring {
  0%,100% { box-shadow: 0 0 0 0 rgba(201,168,76,0.4); }
  50% { box-shadow: 0 0 20px 8px rgba(201,168,76,0.1); }
}
.intro-ring:nth-child(1)::after, .intro-ring:nth-child(2)::after {
  content: ""; position: absolute; top: 50%; left: 50%;
  transform: translate(-50%,-50%); width: 8px; height: 8px;
  background: var(--gold); border-radius: 50%; opacity: 0.6;
}
.intro-names { text-align: center; animation: fadeUp 1s 0.5s cubic-bezier(0.16,1,0.3,1) both; }
@keyframes fadeUp {
  from { transform: translateY(30px); opacity: 0; }
  to   { transform: translateY(0); opacity: 1; }
}
.intro-names h1 {
  font-family: "Amiri", serif;
  font-size: clamp(36px, 10vw, 56px);
  background: linear-gradient(135deg, #8B6914 0%, #E8C97A 40%, #C9A84C 60%, #8B6914 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  line-height: 1.2;
}
.intro-names .amp {
  font-family: "Amiri", serif; font-size: 28px;
  color: var(--gold); -webkit-text-fill-color: var(--gold);
  display: block; margin: 4px 0;
}
.tap-hint {
  margin-top: 48px; font-size: 13px;
  color: rgba(201,168,76,0.5); letter-spacing: 0.2em;
  animation: fadeUp 1s 1s both, blink 2s 2s ease-in-out infinite;
}
@keyframes blink { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

#curtain-left, #curtain-right {
  position: fixed; top: 0; z-index: 99;
  width: 50vw; height: 100vh;
  background: linear-gradient(to bottom, #1A0E08, #0a0502);
  transition: transform 1.2s cubic-bezier(0.76,0,0.24,1);
}
#curtain-left  { left: 0;  transform: translateX(0); }
#curtain-right { right: 0; transform: translateX(0); }
#curtain-left.open  { transform: translateX(-100%); }
#curtain-right.open { transform: translateX(100%); }
#curtain-left::after  { content: ""; position: absolute; top: 0; right: 0; width: 2px; height: 100%; background: linear-gradient(to bottom, transparent, var(--gold), transparent); }
#curtain-right::after { content: ""; position: absolute; top: 0; left: 0; width: 2px; height: 100%; background: linear-gradient(to bottom, transparent, var(--gold), transparent); }

#main {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 40px 16px;
  background: radial-gradient(ellipse at 50% 0%, #2C1810 0%, #0a0502 60%);
  opacity: 0; transition: opacity 0.8s 0.8s;
}
#main.visible { opacity: 1; }

.card {
  position: relative; width: min(500px, 96vw);
  background: linear-gradient(160deg, #FDF6E3 0%, #F5E6D3 60%, #EDD9B8 100%);
  border-radius: 2px; overflow: hidden;
  box-shadow: 0 0 0 1px #8B6914, 0 0 60px rgba(201,168,76,0.2), 0 40px 100px rgba(0,0,0,0.8);
  animation: cardReveal 1s 1s cubic-bezier(0.16,1,0.3,1) both;
}
@keyframes cardReveal {
  from { transform: scale(0.85) translateY(40px); opacity: 0; }
  to   { transform: scale(1) translateY(0); opacity: 1; }
}
.strip { width: 100%; height: 6px; background: linear-gradient(90deg, #1A0E08 0%, #C9A84C 25%, #E8C97A 50%, #C9A84C 75%, #1A0E08 100%); }
.corner { position: absolute; width: 72px; height: 72px; z-index: 2; }
.corner svg { width: 100%; height: 100%; }
.corner.tl { top: 0; right: 0; }
.corner.tr { top: 0; left: 0; transform: scaleX(-1); }
.corner.bl { bottom: 0; right: 0; transform: scaleY(-1); }
.corner.br { bottom: 0; left: 0; transform: scale(-1); }
.border-line { position: absolute; inset: 12px; border: 1px solid rgba(201,168,76,0.4); pointer-events: none; z-index: 1; }
.inner { padding: 48px 40px 40px; text-align: center; position: relative; z-index: 2; }
.rings { display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
.ring { width: 32px; height: 32px; border-radius: 50%; border: 2.5px solid var(--gold); position: relative; flex-shrink: 0; }
.ring::after { content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 8px; height: 8px; border-radius: 50%; background: var(--gold); opacity: 0.4; }
.ring:first-child { margin-left: -10px; }
.basmala { font-family: "Amiri", serif; font-size: 14px; color: #5C3D2E; opacity: 0.8; margin-bottom: 18px; }
.divider { display: flex; align-items: center; gap: 8px; margin: 14px 0; justify-content: center; }
.dl { flex: 1; max-width: 60px; height: 1px; background: linear-gradient(to left, transparent, var(--gold)); }
.dl.r { background: linear-gradient(to right, transparent, var(--gold)); }
.dd { width: 5px; height: 5px; background: var(--gold); transform: rotate(45deg); flex-shrink: 0; }
.invite-label { font-size: 12px; color: #8B6914; letter-spacing: 0.15em; margin-bottom: 10px; }
.names { margin: 16px 0; }
.name {
  font-family: "Amiri", serif; font-size: clamp(38px, 10vw, 48px); font-weight: 700;
  background: linear-gradient(135deg, #2C1810 0%, #8B6914 40%, #2C1810 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1.1;
}
.heart { font-size: 24px; color: var(--gold); display: block; margin: 6px 0; animation: heartbeat 1.5s ease-in-out infinite; }
@keyframes heartbeat {
  0%,100% { transform: scale(1); } 14% { transform: scale(1.2); } 28% { transform: scale(1); } 42% { transform: scale(1.1); } 56% { transform: scale(1); }
}
.details {
  margin-top: 24px; background: rgba(201,168,76,0.07);
  border: 1px solid rgba(201,168,76,0.25); border-radius: 2px; padding: 18px 20px;
}
.detail-row { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; text-align: right; }
.detail-row:last-child { margin-bottom: 0; }
.detail-icon { font-size: 16px; flex-shrink: 0; margin-top: 3px; }
.detail-label { font-size: 10px; color: var(--gold-dim); letter-spacing: 0.12em; display: block; font-weight: 600; margin-bottom: 2px; text-transform: uppercase; }
.detail-value { font-family: "Amiri", serif; font-size: 17px; color: #2C1810; font-weight: 700; display: block; line-height: 1.3; }
.detail-sub { font-size: 12px; color: #5C3D2E; display: block; margin-top: 1px; }
.music-btn {
  display: inline-flex; align-items: center; gap: 10px; margin-top: 24px;
  background: linear-gradient(135deg, #C9A84C, #8B6914);
  color: #FDF6E3; border: none; cursor: pointer;
  padding: 12px 28px; border-radius: 50px;
  font-family: "Tajawal", sans-serif; font-size: 14px; font-weight: 500;
  box-shadow: 0 4px 20px rgba(201,168,76,0.3);
  transition: transform 0.2s, box-shadow 0.2s; letter-spacing: 0.04em;
}
.music-btn:hover { transform: scale(1.05); box-shadow: 0 6px 28px rgba(201,168,76,0.5); }
.footer-text { margin-top: 22px; font-family: "Amiri", serif; font-size: 15px; color: #5C3D2E; opacity: 0.85; line-height: 1.8; }
.footer-sub { font-size: 12px; color: #8B6914; }
</style>
</head>

      <button class="music-btn" id="musicBtn" onclick="toggleMusic()">
        <span id="musicIcon">🎵</span>
        <span id="musicLabel">شغّل أغنية الفرح</span>
      </button>

      <p class="footer-text">

<script>
const pc = document.getElementById("particles");
for (let i = 0; i < 60; i++) {
  const p = document.createElement("div");
  p.className = "particle";
  p.style.cssText = `left:${Math.random()*100}%;--d:${3+Math.random()*5}s;animation-delay:${Math.random()*5}s;width:${1+Math.random()*3}px;height:${1+Math.random()*3}px;`;
  pc.appendChild(p);
}

function openInvitation() {
  const intro = document.getElementById("intro");
  const cl = document.getElementById("curtain-left");
  const cr = document.getElementById("curtain-right");
  const main = document.getElementById("main");
  const audio = document.getElementById("weddingAudio");

  intro.style.transition = "opacity 0.4s";
  intro.style.opacity = "0";
  setTimeout(() => { intro.style.display = "none"; }, 400);

  setTimeout(() => { cl.classList.add("open"); cr.classList.add("open"); }, 300);
  setTimeout(() => { main.classList.add("visible"); }, 600);
  setTimeout(() => { cl.remove(); cr.remove(); }, 1800);

  // Play audio after user interaction (gesture already happened)
  audio.play().catch(() => {});
  document.getElementById("musicIcon").textContent = "⏸";
  document.getElementById("musicLabel").textContent = "إيقاف الأغنية";
}

function toggleMusic() {
  const audio = document.getElementById("weddingAudio");
  const icon = document.getElementById("musicIcon");
  const label = document.getElementById("musicLabel");
  if (audio.paused) {
    audio.play();
    icon.textContent = "⏸";
    label.textContent = "إيقاف الأغنية";
  } else {
    audio.pause();
    icon.textContent = "🎵";
    label.textContent = "شغّل أغنية الفرح";
  }
}
</script>
