<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محمود & رويدا — عقد قران</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --ivory:#FBF6EE;
  --gold:#C8A96E;
  --gold2:#E8D5A3;
  --dark:#1C1208;
  --brown:#4A2E0A;
  --cream:#F5EDD8;
}
html,body{width:100%;min-height:100%;background:#0e0a04;font-family:"Tajawal",sans-serif;overflow-x:hidden}

/* ── INTRO ── */
#intro{
  position:fixed;inset:0;z-index:200;
  background:#0e0a04;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;
}
.stars{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.star{
  position:absolute;border-radius:50%;
  background:var(--gold2);opacity:0;
  animation:twinkle var(--d) ease-in-out infinite var(--delay);
}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(0.5)}50%{opacity:0.8;transform:scale(1)}}

.intro-silhouette{
  width:220px;height:220px;
  position:relative;
  animation:riseUp 1.2s cubic-bezier(0.16,1,0.3,1) both;
}
@keyframes riseUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}

/* SVG couple silhouette */
.intro-title{
  margin-top:32px;
  font-family:"Amiri",serif;
  font-size:clamp(32px,9vw,52px);
  background:linear-gradient(135deg,#8B6520 0%,#E8D5A3 45%,#C8A96E 65%,#8B6520 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  text-align:center;
  animation:riseUp 1s 0.6s both;
}
.intro-sub{
  margin-top:8px;font-size:13px;color:rgba(200,169,110,0.6);
  letter-spacing:0.2em;
  animation:riseUp 1s 0.9s both;
}
.tap-hint{
  margin-top:48px;font-size:12px;color:rgba(200,169,110,0.45);
  letter-spacing:0.25em;
  animation:riseUp 1s 1.2s both, blink 2s 2s infinite;
}
@keyframes blink{0%,100%{opacity:0.45}50%{opacity:1}}

/* ── CURTAIN ── */
#cl,#cr{
  position:fixed;top:0;z-index:190;width:50vw;height:100vh;
  background:linear-gradient(to bottom,#1C1208,#0e0a04);
  transition:transform 1.4s cubic-bezier(0.76,0,0.24,1);
}
#cl{left:0}#cr{right:0}
#cl::after,#cr::after{
  content:"";position:absolute;top:0;height:100%;width:1px;
  background:linear-gradient(to bottom,transparent,var(--gold),transparent);
}
#cl::after{right:0}#cr::after{left:0}
#cl.open{transform:translateX(-100%)}
#cr.open{transform:translateX(100%)}

/* ── MAIN ── */
#main{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:40px 16px;
  background:radial-gradient(ellipse at 50% 0%,#2a1a05 0%,#0e0a04 65%);
  opacity:0;transition:opacity 0.8s 0.9s;
}
#main.visible{opacity:1}

/* ── CARD ── */
.card{
  position:relative;
  width:min(520px,96vw);
  background:linear-gradient(160deg,#FEFAF2 0%,#F8EDCF 55%,#F0DFB5 100%);
  border-radius:3px;
  overflow:hidden;
  box-shadow:0 0 0 1px #8B6520,0 0 80px rgba(200,169,110,0.25),0 50px 120px rgba(0,0,0,0.85);
  animation:cardIn 1s 1.2s cubic-bezier(0.16,1,0.3,1) both;
}
@keyframes cardIn{from{transform:translateY(50px) scale(0.88);opacity:0}to{transform:none;opacity:1}}

/* Gold strip top & bottom */
.strip-top,.strip-bot{
  width:100%;height:7px;
  background:linear-gradient(90deg,#1C1208 0%,#C8A96E 20%,#E8D5A3 50%,#C8A96E 80%,#1C1208 100%);
}

/* Corner ornaments */
.corner{position:absolute;width:80px;height:80px;z-index:3}
.corner svg{width:100%;height:100%}
.corner.tl{top:7px;right:0}
.corner.tr{top:7px;left:0;transform:scaleX(-1)}
.corner.bl{bottom:7px;right:0;transform:scaleY(-1)}
.corner.br{bottom:7px;left:0;transform:scale(-1,-1)}

.border-line{position:absolute;inset:14px;border:1px solid rgba(200,169,110,0.35);pointer-events:none;z-index:1}

/* ── VENUE ILLUSTRATION ── */
.venue-wrap{
  position:relative;width:100%;height:200px;
  overflow:hidden;
  background:linear-gradient(to bottom,#1a1005,#2d1e08);
}
.venue-glow{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:320px;height:80px;
  background:radial-gradient(ellipse,rgba(200,169,110,0.35) 0%,transparent 70%);
}

/* ── COUPLE SVG in venue ── */
.couple-svg{
  position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
  width:160px;height:130px;
}

/* Stars in venue bg */
.venue-star{
  position:absolute;border-radius:50%;background:#E8D5A3;opacity:0;
  animation:twinkle var(--d) ease-in-out infinite var(--delay);
}

/* ── INNER CONTENT ── */
.inner{padding:32px 36px 36px;text-align:center;position:relative;z-index:2}

.basmala{font-family:"Amiri",serif;font-size:15px;color:#5C3D14;opacity:0.85;margin-bottom:20px}

.divider{display:flex;align-items:center;gap:8px;justify-content:center;margin:14px 0}
.dl{flex:1;max-width:70px;height:1px;background:linear-gradient(to left,transparent,var(--gold))}
.dl.r{background:linear-gradient(to right,transparent,var(--gold))}
.dd{width:6px;height:6px;background:var(--gold);transform:rotate(45deg);flex-shrink:0}
.dd2{width:4px;height:4px;border:1px solid var(--gold);transform:rotate(45deg);flex-shrink:0;margin:0 2px}

.event-label{font-size:11px;color:#8B6520;letter-spacing:0.18em;margin-bottom:10px;font-weight:500}

.names{margin:18px 0}
.name{
  font-family:"Amiri",serif;
  font-size:clamp(40px,10vw,52px);font-weight:700;
  background:linear-gradient(135deg,#2C1505 0%,#8B6520 40%,#2C1505 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  line-height:1.1;
}
.heart{
  font-size:22px;color:var(--gold);display:block;margin:6px 0;
  animation:hb 1.6s ease-in-out infinite;
}
@keyframes hb{0%,100%{transform:scale(1)}14%{transform:scale(1.25)}28%{transform:scale(1)}42%{transform:scale(1.12)}56%{transform:scale(1)}}

/* ── DETAILS BOX ── */
.details{
  margin-top:22px;
  background:rgba(200,169,110,0.08);
  border:1px solid rgba(200,169,110,0.3);
  border-radius:2px;
  padding:18px 20px;
}
.detail-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px;text-align:right}
.detail-row:last-child{margin-bottom:0}
.dicon{font-size:17px;flex-shrink:0;margin-top:2px}
.dlabel{font-size:10px;color:#8B6520;letter-spacing:0.12em;display:block;font-weight:600;margin-bottom:2px;text-transform:uppercase}
.dval{font-family:"Amiri",serif;font-size:18px;color:#2C1505;font-weight:700;display:block;line-height:1.3}
.dsub{font-size:12px;color:#5C3D14;display:block;margin-top:2px}

/* ── FOOTER ── */
.footer-text{
  margin-top:24px;
  font-family:"Amiri",serif;font-size:15px;
  color:#5C3D14;opacity:0.85;line-height:1.9;
}
.footer-sub{font-size:12px;color:#8B6520}
</style>
</head>

            <span class="dsub">الأوبن إير</span>
          </div>
        </div>
      </div>

      <p class="footer-text">
        نتشرف بحضوركم وتشريفكم<br>
        <span class="footer-sub">فرحتنا فرحتكم 🌙✨</span>
      </p>

</div>

<script>
// Generate twinkling stars in intro
const sc = document.getElementById('stars');
for(let i=0;i<80;i++){
  const s=document.createElement('div');
  s.className='star';
  const size=Math.random()*2+1;
  s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${size}px;height:${size}px;--d:${2+Math.random()*4}s;--delay:${Math.random()*4}s`;
  sc.appendChild(s);
}

function openCard(){
  const intro=document.getElementById('intro');
  const cl=document.getElementById('cl');
  const cr=document.getElementById('cr');
  const main=document.getElementById('main');
  intro.style.transition='opacity 0.4s';
  intro.style.opacity='0';
  setTimeout(()=>intro.style.display='none',400);
  setTimeout(()=>{cl.classList.add('open');cr.classList.add('open')},300);
  setTimeout(()=>main.classList.add('visible'),700);
  setTimeout(()=>{cl.remove();cr.remove()},2000);
}
</script>
